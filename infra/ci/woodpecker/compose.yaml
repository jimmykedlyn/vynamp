# Woodpecker CI/CD (TASK-E15-04, ADR-010). Secrets and data live outside Git under
# D:/Projects/vynamp-media-player/.cache/woodpecker. Ports bind to loopback only;
# the tunnel exposes HTTP 8000 and never gRPC 9000.
name: vynamp-woodpecker
services:
  woodpecker-server:
    image: docker.io/woodpeckerci/woodpecker-server:v3.20.1@sha256:0f31560e29d67ec4a06d6eeee4bac38d2a2697a6a741b8a0db3998180f3a3517
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:9000:9000"
    volumes:
      - woodpecker-data:/var/lib/woodpecker
    env_file:
      - D:/Projects/vynamp-media-player/.cache/woodpecker/secrets/server.env
    environment:
      WOODPECKER_HOST: https://ci-cd-vynamp.jkca.lat
      WOODPECKER_OPEN: "false"
      WOODPECKER_ADMIN: jimmykedlyn
      WOODPECKER_REPO_OWNERS: jimmykedlyn
      WOODPECKER_GITHUB: "true"
      WOODPECKER_DISABLE_USER_AGENT_REGISTRATION: "true"
      # The gate workflow is the required GitHub status "CI Gate" (ADR-010).
      WOODPECKER_STATUS_CONTEXT: woodpecker
      WOODPECKER_STATUS_CONTEXT_FORMAT: '{{ if eq .workflow "gate" }}CI Gate{{ else }}{{ .context }}/{{ .event }}/{{ .workflow }}{{ end }}'
      WOODPECKER_DEFAULT_CLONE_PLUGIN: docker.io/woodpeckerci/plugin-git:2.10.1@sha256:550075c844fcec0af41d9d28f9860aa5d8c43e1e9419be4b9266dc02c2f29804
      WOODPECKER_PLUGINS_TRUSTED_CLONE: docker.io/woodpeckerci/plugin-git:2.10.1@sha256:550075c844fcec0af41d9d28f9860aa5d8c43e1e9419be4b9266dc02c2f29804
      # The link to api.github.com drops ~1 in 5 new connections; a hung dial
      # used to burn the single 30s attempt ("context deadline exceeded").
      WOODPECKER_FORGE_TIMEOUT: 45s
      WOODPECKER_FORGE_RETRY: "10"
      WOODPECKER_MAX_PIPELINE_TIMEOUT: "120"
      WOODPECKER_LOG_LEVEL: info

  woodpecker-agent-linux:
    image: docker.io/woodpeckerci/woodpecker-agent:v3.20.1@sha256:a7d7299a13add0b3936fa0ac9ed23507fe283a7fc7d9596c4289d7e8206541eb
    restart: unless-stopped
    depends_on:
      - woodpecker-server
    volumes:
      - woodpecker-agent-linux:/etc/woodpecker
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - D:/Projects/vynamp-media-player/.cache/woodpecker/secrets/agent.env
    environment:
      WOODPECKER_SERVER: woodpecker-server:9000
      WOODPECKER_BACKEND: docker
      WOODPECKER_HOSTNAME: vynamp-linux
      WOODPECKER_AGENT_LABELS: host=vynamp-linux
      WOODPECKER_MAX_WORKFLOWS: "1"

  cloudflared:
    image: docker.io/cloudflare/cloudflared:2026.10.1@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5
    profiles: [tunnel]
    restart: unless-stopped
    depends_on:
      - woodpecker-server
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - D:/Projects/vynamp-media-player/.cache/woodpecker/secrets/cloudflared:/etc/cloudflared:ro

volumes:
  woodpecker-data:
    name: vynamp-woodpecker-data
  woodpecker-agent-linux:
    name: vynamp-woodpecker-agent-linux
