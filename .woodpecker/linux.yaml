# Linux/Docker agent CI (ADR-010): docs, tooling and desktop core for
# x86_64-unknown-linux-gnu. Part of the Woodpecker CI Gate.
labels:
  host: vynamp-linux

when:
  - event: [push, pull_request, manual]

# Full (non-partial) clone with retries: the link to github.com drops about 1
# in 5 new connections, and partial clones open more of them during checkout.
clone:
  - name: clone
    image: docker.io/woodpeckerci/plugin-git:2.10.1@sha256:550075c844fcec0af41d9d28f9860aa5d8c43e1e9419be4b9266dc02c2f29804
    settings:
      partial: false
      attempts: 10

steps:
  - name: tooling
    image: docker.io/library/rust:1.99.0-bookworm@sha256:114c7a4425406451c2866b6aafe69fe29b1b298832db1277d411ac73c82d04d6
    environment:
      CARGO_TERM_COLOR: never
    commands:
      - echo "tested sha=$CI_COMMIT_SHA ref=$CI_COMMIT_REF event=$CI_PIPELINE_EVENT"
      - git rev-parse HEAD
      - rustc --version
      - cargo xtask ci docs
      - cargo clippy --package xtask --all-targets --locked -- -D warnings
      - cargo test --workspace --all-targets --locked
      # No pipe: sh -e has no pipefail, so `detect | tee` would mask a detect failure.
      - cargo xtask ci detect > detect.json
      - cat detect.json
      - |
        if grep -q '"core":"true"' detect.json; then
          apt-get update && apt-get install -y libasound2-dev libudev-dev pkg-config
          cargo xtask ci core --target x86_64-unknown-linux-gnu
        else
          echo 'core sources absent: desktop app not tested (not an app approval)'
        fi
