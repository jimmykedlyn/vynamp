version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
  # Workflows pin actions by commit SHA; Dependabot is the only thing that
  # keeps those SHAs moving without hand-editing a hash.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
