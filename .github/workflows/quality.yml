name: Quality

# Hardware acceptance is never part of the CI Gate: it needs real devices and
# real audio hardware, so it only runs when a maintainer asks for it, from an
# integrated branch, and only after confirming the self-hosted runners exist.
# See ADR-014.
on:
  workflow_dispatch:
    inputs:
      confirm_hardware_runners:
        description: 'Run on the vynamp-hardware / vynamp-android-device self-hosted runners'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preflight:
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - name: Confirm hardware runners
        shell: bash
        env:
          CONFIRMED: ${{ inputs.confirm_hardware_runners }}
        run: |
          if [ "$CONFIRMED" = "true" ]; then
            echo 'Hardware runners confirmed by the maintainer; dispatching the matrix.'
          else
            echo 'Skipped: hardware runners are not provisioned yet (TASK-E15-05).'
            echo 'Re-dispatch with confirm_hardware_runners = true once they are online.'
            echo 'Build CI stays on ci.yml; hardware, soak and bit-perfect are not covered here.'
          fi

  trusted-hardware:
    needs: preflight
    if: inputs.confirm_hardware_runners
    environment: hardware-validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - labels: [self-hosted, Windows, X64, vynamp-hardware]
          - labels: [self-hosted, Linux, X64, vynamp-hardware]
          - labels: [self-hosted, macOS, X64, vynamp-hardware]
          - labels: [self-hosted, macOS, ARM64, vynamp-hardware]
          - labels: [self-hosted, Linux, X64, vynamp-android-device]
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Provision pinned Rust toolchain
        run: rustup show
      - run: cargo xtask quality-gate

  # AC-3 of TASK-E15-04: um job que pula por falta de hardware ou de fonte nao
  # aprova nada. O GitHub reporta o skip como `skipped`, e um run que termina
  # sem este agregado fica verde com a matriz inteira pulada -- exatamente o
  # "skip sem fonte aprovando o player" que o criterio proibe. Este job roda
  # sempre e compara contra `success`, entao skip reprova.
  verdict:
    name: Hardware Gate
    if: always()
    needs: [preflight, trusted-hardware]
    runs-on: ubuntu-22.04
    steps:
      - name: Aggregate
        shell: bash
        run: |
          test "${{ needs.preflight.result }}" = success
          if [ "${{ needs.trusted-hardware.result }}" != success ]; then
            echo "Hardware Gate failed: the matrix result is '${{ needs.trusted-hardware.result }}'."
            echo 'A skipped matrix measured nothing, so it approves nothing.'
            echo 'Re-dispatch with confirm_hardware_runners = true once the runners are online.'
            exit 1
          fi
          echo 'Hardware Gate passed: the matrix ran on real devices.'
