name: CI

# Gate do umbrella. Nao constroi app: os apps sao repos proprios com CI propria.
# O gate valida o que o umbrella e dono: specs, ferramental, pins de submodule
# e as regras de arquitetura. Ver AGENTS.md secao 1.2.
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  specs:
    name: Specs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # O passo 37 mudou 134 das 191 TASKs para o repositorio dono de cada uma
          # (`01-arvore-final.md` secao 1). `check-docs` resolve o Markdown da task pelo
          # campo `repo` do backlog, e o INDEX/los requisitos apontam para dentro dos
          # submodulos: sem eles o job validaria uma arvore diferente da da estacao --
          # exatamente a divergencia que `doc_files()` foi escrito para evitar. Os
          # arquivos lidos aqui sao Markdown e JSON; nada e compilado.
          submodules: recursive
      - name: Provision pinned Rust toolchain
        run: rustup show
      - run: cargo xtask check-docs

  tooling:
    name: Tooling
    # macOS Intel and Apple Silicon are mandatory targets (REQ-E19-01), and a
    # target nothing runs on is not verified. This is the cheapest job that can
    # carry them: fmt, clippy and the xtask tests are fast and host-agnostic,
    # and the umbrella owns no application build to put on a Mac runner
    # instead (D-CI-1 still forbids `ci core` and `ci android` here).
    #
    # `macos-15-intel` is the Intel image and `macos-15` the Apple Silicon one;
    # `macos-latest` is deliberately not used, because it silently changes
    # architecture as GitHub rotates it and a target that moves is not pinned.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, windows-2022, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Provision pinned Rust toolchain
        run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --package xtask --all-targets --locked -- -D warnings
      - run: cargo test --package xtask --locked
      # AC-5 of TASK-E19-01 requires that no credential sits in the history. The
      # Woodpecker preflight that used to look for one left with ADR-014, and the
      # claim went unverified until `check-secrets` was written -- so the scan has
      # to run somewhere, or it is a tool nothing uses. It reads every blob
      # reachable from every ref, which needs full history: a shallow checkout
      # would scan the working tree and report a repository clean whose history
      # still holds the token.
      - name: Full history for the secret scan
        run: git fetch --unshallow || true
      - run: cargo xtask check-secrets

  delivery:
    name: Delivery
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Provision pinned Rust toolchain
        run: rustup show
      # `check-delivery` e o gate que le os proprios workflows: pins por SHA,
      # `permissions: contents: read`, `persist-credentials: false` e a matriz
      # dos cinco alvos. Sem um job que o rode, essas regras existem no xtask e
      # ninguem as aplica -- o CI ficaria verde enquanto o arquivo que ele le
      # deriva.
      - run: cargo xtask check-delivery

  android:
    name: Android toolchain
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Provision pinned Rust toolchain
        run: rustup show
      # O umbrella nao constroi app (D-CI-1), entao o alvo Android nao pode ser
      # um build aqui. O que se verifica e o que o umbrella possui: o alvo Rust
      # `aarch64-linux-android` existe no toolchain pinado e o `detect` diz a
      # verdade sobre haver ou nao app para construir. O build de verdade roda
      # no CI do repo do app.
      - run: rustup target add aarch64-linux-android
      - run: cargo xtask ci detect

  submodules:
    name: Submodules fixados
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Provision pinned Rust toolchain
        run: rustup show
      - name: Submodule must be pinned to a commit, never to a branch
        run: |
          set -eu
          git submodule status --recursive
          if git config --file .gitmodules --get-regexp '^submodule\..*\.branch$' > /dev/null 2>&1; then
            echo 'Submodule tracking a branch is forbidden; pin to a commit.'
            exit 1
          fi

  arch:
    name: Regras de arquitetura
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Sem isto o job le libs/*/Cargo.toml de diretorios vazios e falha
          # no primeiro run com "submodule ainda nao adicionado".
          submodules: recursive
          persist-credentials: false
      - name: Provision pinned Rust toolchain
        run: rustup show
      - name: Rule 3-4 dependency direction
        run: |
          # `pipefail` nao e detalhe: sem ele o status da pipeline e o do ultimo
          # comando (`grep`), e `cargo tree` falhando -- manifest que nao carrega,
          # workspace confuso -- leria como "nenhuma violacao encontrada". A
          # regra passaria a declarar verificado o que nao conseguiu ler.
          set -euo pipefail
          # vynamp-dsp NAO entra nesta lista: AGENTS.md 1.4 o define como
          # primitivas, nao dominio, e 01-arvore-final o permite opcional em
          # decode/encode/output. Lista-lo aqui contradiria a arvore aprovada.
          #
          # Os tres modulos sao submodulos fixados, e o checkout deste job e
          # `submodules: recursive`. Ausencia de fonte nao e "nada a verificar":
          # e o checkout que nao trouxe o que o gate deveria ler, e aprovar por
          # ausencia e a falha que a AC-3 proibe. Por isso a condicao e
          # tudo-ou-nada e a ausencia reprova, em vez de sair com 0.
          present=0
          for m in decode encode output; do
            if [ -f "libs/$m/Cargo.toml" ]; then present=$((present + 1)); fi
          done
          if [ "$present" -eq 0 ]; then
            echo 'Nenhum lib de modulo encontrado: o checkout nao trouxe os submodulos.'
            echo 'Regra sobre fonte ausente nao aprova; verifique `submodules: recursive`.'
            exit 1
          fi
          if [ "$present" -ne 3 ]; then
            echo "libs/ parcialmente migrado: $present de 3 modulos presentes."
            echo 'decode, encode e output entram juntos; um sozinho e migracao incompleta.'
            for m in decode encode output; do
              [ -f "libs/$m/Cargo.toml" ] || echo "  faltando: libs/$m"
            done
            exit 1
          fi
          # `cargo tree` roda fora do pipe, com o stderr visivel e o status checado
          # pelo `set -e`. O `2>/dev/null` que havia aqui era o mesmo buraco do
          # `pipefail`: um manifest que nao carrega virava arvore vazia, e arvore
          # vazia nao tem dependencia proibida.
          for m in decode encode output; do
            tree=$(cargo tree --manifest-path "libs/$m/Cargo.toml" --prefix none)
            if printf '%s\n' "$tree" \
                 | grep -E '^vynamp-(engine|player|converter|restore)( |$)'; then
              echo "libs/$m depende de crate de dominio do projeto; viola AGENTS.md 1.2."
              exit 1
            fi
          done
          if [ -f libs/dsp/Cargo.toml ]; then
            tree=$(cargo tree --manifest-path libs/dsp/Cargo.toml --prefix none)
            if printf '%s\n' "$tree" \
                 | grep -E '^vynamp-(engine|player|converter|restore|decode|encode|output)( |$)'; then
              echo 'libs/dsp depende de outra lib do projeto; viola AGENTS.md 1.4.'
              exit 1
            fi
          fi
          echo 'Regras 3 e 4 verificadas.'
      - name: Rule 5, each lib builds alone
        run: |
          set -eu
          for d in libs/*; do
            [ -f "$d/Cargo.toml" ] || continue
            cargo build --manifest-path "$d/Cargo.toml"
          done

  tasks:
    name: TASKs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # O backlog aponta a TASK para o repositorio dono, e a maioria mora nos
          # submodulos: sem eles o gate leria a arvore do runner -- vazia de tasks --
          # e aprovaria por ausencia.
          submodules: recursive
          persist-credentials: false
      - name: Provision pinned Rust toolchain
        run: rustup show
      - run: cargo xtask check-tasks

  authoring:
    name: Authoring
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Mesma razao do job `tasks`: os bullets auditados moram nos repos de
          # modulo, e sem os submodulos o gate leria zero arquivos e aprovaria.
          submodules: recursive
          persist-credentials: false
      - name: Provision pinned Rust toolchain
        run: rustup show
      # Le so o Markdown das TASKs: sem build, sem hardware. Uma fronteira sem
      # dono nao e verificavel, e o gate a reprova em vez de deixar passar.
      - run: cargo xtask check-authoring

  gate:
    name: CI Gate
    if: always()
    needs: [specs, tooling, delivery, android, submodules, arch, tasks, authoring]
    runs-on: ubuntu-22.04
    steps:
      - name: Aggregate
        shell: bash
        run: |
          # Comparacao contra `success`, nunca contra `failure`: o GitHub
          # reporta job pulado como `skipped`, e um gate que so rejeita
          # `failure` publica verde para um job que ninguem rodou. Skip por
          # falta de hardware ou de fonte nao aprova nada.
          test "${{ needs.specs.result }}" = success
          test "${{ needs.tooling.result }}" = success
          test "${{ needs.delivery.result }}" = success
          test "${{ needs.android.result }}" = success
          test "${{ needs.submodules.result }}" = success
          test "${{ needs.arch.result }}" = success
          test "${{ needs.tasks.result }}" = success
          test "${{ needs.authoring.result }}" = success
          echo 'CI Gate passed: specs, tooling, delivery, android, submodules, architecture rules, tasks and authoring.'
          echo 'Hardware, signing and release acceptance remain separate gates.'
